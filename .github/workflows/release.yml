name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (use \n for newlines)
        type: string
        required: false
      bump:
        description: 'Bump type'
        required: false
        default: 'next'
        type: choice
        options:
          - 'next'
          - 'major'
          - 'minor'
          - 'patch'
          - 'current'
      github_release:
        description: 'Create Github Release'
        default: true
        type: boolean
      docker_release:
        description: 'Push Docker images'
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_current: ${{ steps.versions.outputs.version_current }}
      version_next: ${{ steps.versions.outputs.version_next }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install svu
        run: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt update
          sudo apt install svu
      - name: Compute next version for release
        run: |
          echo "VERSION_NEXT=$(svu ${{ inputs.bump }})" >> "$GITHUB_ENV"
      - name: Set Versions
        id: versions
        run: |
          echo "version_current=$(svu current)" >> "$GITHUB_OUTPUT"
          echo "version_next=${{ env.VERSION_NEXT }}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Display versions
        run: |
          echo "Current version: ${{ needs.version.outputs.version_current }}"
          echo "Release version: ${VERSION}"

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: komga-webui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build web UI
        working-directory: komga-webui
        run: |
          npm ci
          npm run build

      - name: Build Rust release binary
        working-directory: komga-rust
        run: cargo build --locked --release --bin komga-rust

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          release_binary="dist/komga-riir-${VERSION}-linux-amd64.gz"
          gzip -c "komga-rust/target/release/komga-rust" > "$release_binary"
          release_sha256=$(sha256sum "$release_binary" | cut -d' ' -f1)
          echo "RELEASE_BINARY=$release_binary" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$release_sha256" >> "$GITHUB_ENV"

      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p release_notes
          printf '%b\n' "$RELEASE_NOTES" > release_notes/release_notes.md
          release_binary_name=$(basename "$RELEASE_BINARY")
          {
            echo ""
            echo "## Checksums"
            echo ""
            printf -- '- `%s`: `%s`\n' "$release_binary_name" "$RELEASE_SHA256"
          } >> release_notes/release_notes.md
          echo "Release notes:"
          cat release_notes/release_notes.md
          echo ""

      - name: Create or update GitHub Release
        if: inputs.github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes-file release_notes/release_notes.md
            gh release upload "${VERSION}" "$RELEASE_BINARY" --clobber
          else
            gh release create "${VERSION}" "$RELEASE_BINARY" --target "${GITHUB_SHA}" --title "${VERSION}" --notes-file release_notes/release_notes.md
          fi

      - name: Set up QEMU
        if: inputs.docker_release
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: inputs.docker_release
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: inputs.docker_release
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        if: inputs.docker_release
        id: image
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "git_commit_time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: inputs.docker_release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./komga-rust/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            BUILD_TIME=${{ steps.image.outputs.build_time }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT_ID=${{ github.sha }}
            GIT_COMMIT_TIME=${{ steps.image.outputs.git_commit_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
