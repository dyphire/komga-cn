name: Tests

on:
  pull_request:
    paths-ignore:
      - 'komga-webui/**'
      - 'komga/**'
      - 'komga-tray/**'
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - 'komga-webui/**'
      - 'komga/**'
      - 'komga-tray/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    name: Rust tests - ${{ matrix.os }}
    defaults:
      run:
        working-directory: komga-rust
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test --workspace
