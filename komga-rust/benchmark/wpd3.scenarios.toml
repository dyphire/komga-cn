# WP-D3 mirror scaffold for Komga Rust-side benchmarking.
# Keep the scenario names aligned with the Java baseline benchmarks.

suite = "wp-d3"
baseline = "java"

[[scenario]]
name = "browse"
java_benchmark = "BrowseBenchmark"
java_case = "browseSeries"
method = "GET"
path = "/api/v1/libraries/{libraryId}/series?sort=metadata.titleSort,asc"

[[scenario]]
name = "dashboard"
java_benchmark = "DashboardBenchmark"
java_case = "loadDashboard"
method = "GET"
path = "/api/v1/dashboard"

[[scenario]]
name = "unsorted"
java_benchmark = "UnsortedBenchmark"
java_case = "getAllSeries|getAllBooks"
method = "GET"
path = "/api/v1/series, /api/v1/books"
