[workspace]
members = [
  ".",
  "crates/runtime-server",
  "crates/compat-testkit",
  "crates/benchmark-wpd3",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = "0.8.6"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
anyhow = "1.0.102"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "1.0.7"
tower = { version = "0.5.2", features = ["util"] }

[package]
name = "komga-rust"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
komga-runtime-server = { path = "crates/runtime-server" }
komga-benchmark-wpd3 = { path = "crates/benchmark-wpd3" }

[dev-dependencies]
tower.workspace = true
anyhow.workspace = true
reqwest.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
komga-compat-testkit = { path = "crates/compat-testkit" }
