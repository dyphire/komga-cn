[workspace]
members = [
  ".",
  "crates/kepubify",
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/interfaces",
  "crates/config",
  "crates/server",
  "crates/contract-testkit",
  "crates/benchmark-wpd3",
  "crates/build-support",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = "0.8.6"
axum-extra = { version = "0.12.5", features = ["cookie", "multipart"] }
base64 = "0.22.1"
bcrypt = "0.19.0"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-uring", "sync"] }
tokio-stream = "0.1.17"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
tracing = "0.1.41"
http-body = "1.0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "json", "time"] }
anyhow = "1.0.102"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.12.3"
rxing = "0.8.5"
toml = "1.1.2"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tower-sessions = "0.15.0"
oauth2 = "5.0.0"
tantivy = "0.26.0"
tar = "0.4.45"
zip = "8.6.0"
flate2 = "1.1.9"
lopdf = "0.40.0"
quick-xml = "0.39.2"
time = { version = "0.3.44", features = ["formatting", "parsing", "local-offset"] }
tsid = "0.3.4"
futures-util = "0.3.31"
async-trait = "0.1.89"
image = "0.25.8"
mime_guess = "2.0.5"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
language-tags = "0.3.2"
rusqlite = "0.32.1"
pdfium-render = { version = "0.9.0", features = ["thread_safe"] }
unrar = "0.5.8"
unicode-normalization = "0.1.24"
icu = "2.0"
libc = "0.2.186"
windows-sys = "0.61.2"

[package]
name = "komga-rust"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
bcrypt.workspace = true
notify = "8.2.0"
komga-config = { path = "crates/config" }
komga-server = { path = "crates/server" }
komga-benchmark-wpd3 = { path = "crates/benchmark-wpd3" }
komga-domain = { path = "crates/domain" }
komga-application = { path = "crates/application" }
komga-infrastructure = { path = "crates/infrastructure" }
komga-interfaces = { path = "crates/interfaces" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tower-http.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
zip.workspace = true
sha2.workspace = true
lopdf.workspace = true
tantivy.workspace = true
tempfile = "3.23.0"
image.workspace = true
icu.workspace = true
time.workspace = true
http-body.workspace = true
http-body-util = "0.1.3"
komga-interfaces = { path = "crates/interfaces", features = ["allow-missing-webui-dist"] }
komga-contract-testkit = { path = "crates/contract-testkit" }
