[workspace]
members = [
  ".",
  "crates/kepubify",
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/interfaces",
  "crates/server",
  "crates/contract-testkit",
  "crates/benchmark-wpd3",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = "0.8.6"
axum-extra = { version = "0.12.5", features = ["cookie"] }
base64 = "0.22.1"
bcrypt = "0.19.0"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1.17"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
anyhow = "1.0.102"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "1.1.0"
tower = { version = "0.5.2", features = ["util"] }
tower-sessions = "0.15.0"
oauth2 = "5.0.0"
tantivy = "0.25.0"
zip = "8.4.0"
flate2 = "1.1.9"
lopdf = "0.40.0"
quick-xml = "0.39.2"
time = { version = "0.3.44", features = ["formatting"] }
futures-util = "0.3.31"
image = "0.25.8"

[package]
name = "komga-rust"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
bcrypt.workspace = true
notify = "8.2.0"
komga-server = { path = "crates/server" }
komga-benchmark-wpd3 = { path = "crates/benchmark-wpd3" }
komga-domain = { path = "crates/domain" }
komga-application = { path = "crates/application" }
komga-infrastructure = { path = "crates/infrastructure" }
komga-interfaces = { path = "crates/interfaces" }

[dev-dependencies]
tower.workspace = true
anyhow.workspace = true
reqwest.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile = "3.23.0"
komga-contract-testkit = { path = "crates/contract-testkit" }
