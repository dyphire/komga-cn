[build.env]
passthrough = ["VERSION_NEXT"]

[target.x86_64-unknown-linux-gnu]
image = ":edge"
# Reference: https://github.com/cross-rs/cross/issues/1725
pre-build = [
    'apt-get update && apt-get -y upgrade',
    # Need to upgrade gcc to a version that does not have the bug (because aws-lc-sys's custom build script errors with this:
    #  ### COMPILER BUG DETECTED ###
    #  Your compiler (cc) is not supported due to a memcmp related bug reported in https://gcc.gnu.org/bugzilla/show_bug.cgi?id=95189. We strongly recommend against using this compiler.
    'apt-get -y install gcc-10 g++-10',
    'update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 60',
    'update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 60',
]

[target.aarch64-unknown-linux-gnu]
image = ":edge"

[target.x86_64-unknown-linux-musl]
image = ":edge"

[target.aarch64-unknown-linux-musl]
image = ":edge"
