output_dir = "target/compat-diff"
header_allowlist = ["content-type", "content-disposition", "content-length", "etag", "last-modified", "set-cookie", "x-auth-token", "www-authenticate"]

[[cases]]
id = "P0-OPDS-V2-CATALOG-UNAUTH"
method = "GET"
path = "/opds/v2/catalog"

[[cases]]
id = "P0-OPDS-V2-AUTH-DOCUMENT"
method = "GET"
path = "/opds/v2/auth"

[[cases]]
id = "P6-CORE-LIBRARY-DETAIL-ADMIN-OWNED"
method = "GET"
path = "/api/v1/libraries/1"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}", "X-Komga-Compat-Search-Ownership" = "native-rust-owned" }

[[cases.setup]]
name = "login"
method = "GET"
path = "/api/v2/users/me"
headers = { "Authorization" = "Basic YWRtaW5AZXhhbXBsZS5vcmc6YWRtaW4=", "X-Auth-Token" = "" }
extract_headers = { "SESSION_TOKEN" = "X-Auth-Token" }

[[cases]]
id = "P6-CORE-LIBRARY-DETAIL-USER-OWNED"
method = "GET"
path = "/api/v1/libraries/1"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}", "X-Komga-Compat-Search-Ownership" = "native-rust-owned" }

[[cases.setup]]
name = "login"
method = "GET"
path = "/api/v2/users/me"
headers = { "Authorization" = "Basic dXNlckBleGFtcGxlLm9yZzp1c2Vy", "X-Auth-Token" = "" }
extract_headers = { "SESSION_TOKEN" = "X-Auth-Token" }

[[cases]]
id = "P6-CORE-BOOK-THUMBNAILS-LIST-OWNED"
method = "GET"
path = "/api/v1/books/book-1/thumbnails"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}", "X-Komga-Compat-Search-Ownership" = "native-rust-owned" }

[[cases.setup]]
name = "login"
method = "GET"
path = "/api/v2/users/me"
headers = { "Authorization" = "Basic YWRtaW5AZXhhbXBsZS5vcmc6YWRtaW4=", "X-Auth-Token" = "" }
extract_headers = { "SESSION_TOKEN" = "X-Auth-Token" }

[[cases]]
id = "P12-READLISTS-TACHIYOMI-PUT-OWNED"
method = "PUT"
path = "/api/v1/readlists/readlist-2/read-progress/tachiyomi"
body = "{\"lastBookRead\":1}"
headers = { "Content-Type" = "application/json", "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-THUMBNAIL-GET-OWNED"
method = "GET"
path = "/api/v1/readlists/readlist-1/thumbnail"
comparison = "binary_metadata"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-THUMBNAILS-LIST-OWNED"
method = "GET"
path = "/api/v1/readlists/readlist-1/thumbnails"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-FILE-DOWNLOAD-OWNED"
method = "GET"
path = "/api/v1/readlists/readlist-1/file"
comparison = "binary_metadata"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-CREATE-OWNED"
method = "POST"
path = "/api/v1/readlists"
body = "{\"name\":\"readlist\",\"summary\":\"summary\",\"bookIds\":[\"book-1\"]}"
headers = { "Content-Type" = "application/json", "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-PATCH-OWNED"
method = "PATCH"
path = "/api/v1/readlists/readlist-2"
body = "{\"name\":\"updated\"}"
headers = { "Content-Type" = "application/json", "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-DELETE-OWNED"
method = "DELETE"
path = "/api/v1/readlists/readlist-2"
headers = { "X-Auth-Token" = "${SESSION_TOKEN}" }

[[cases]]
id = "P12-READLISTS-COMICRACK-MATCH-OWNED"
method = "POST"
path = "/api/v1/readlists/match/comicrack"
body = "--komga--"
headers = { "Content-Type" = "multipart/form-data; boundary=komga", "X-Auth-Token" = "${SESSION_TOKEN}" }
