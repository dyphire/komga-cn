schema = "wp-e1.legacy-db-smoke.v1"
output_dir = "target/compat-diff/legacy-db-smoke"
result_archive_dir = "target/compat-diff/legacy-db-smoke/results"
header_allowlist = ["content-type", "content-disposition", "content-length", "etag", "last-modified", "set-cookie", "x-auth-token"]

[env]
java_base_url = "LEGACY_DB_SMOKE_JAVA_BASE_URL"
rust_base_url = "LEGACY_DB_SMOKE_RUST_BASE_URL"
username = "LEGACY_DB_SMOKE_USERNAME"
password = "LEGACY_DB_SMOKE_PASSWORD"
session_token = "LEGACY_DB_SMOKE_SESSION_TOKEN"
java_config_dir = "LEGACY_DB_SMOKE_JAVA_CONFIG_DIR"
rust_config_dir = "LEGACY_DB_SMOKE_RUST_CONFIG_DIR"

[[cases]]
id = "LEGACY-LOGIN-SESSION-01"
name = "login and session"
method = "GET"
path = "/api/v2/users/me"
comparison = "json"
auth = "session"

[[cases.setup]]
name = "login"
method = "POST"
path = "/api/v2/login"
headers = { "Content-Type" = "application/json" }
body_template = '{"username":"${LEGACY_DB_SMOKE_USERNAME}","password":"${LEGACY_DB_SMOKE_PASSWORD}"}'
extract_headers = { "LEGACY_DB_SMOKE_SESSION_TOKEN" = "X-Auth-Token" }

[[cases]]
id = "LEGACY-LIBRARIES-01"
name = "libraries list"
method = "GET"
path = "/api/v1/libraries"
comparison = "json"
headers = { "X-Auth-Token" = "${LEGACY_DB_SMOKE_SESSION_TOKEN}" }

[[cases]]
id = "LEGACY-BOOKS-LIST-01"
name = "books list"
method = "GET"
path = "/api/v1/books"
comparison = "json"
headers = { "X-Auth-Token" = "${LEGACY_DB_SMOKE_SESSION_TOKEN}" }

[[cases]]
id = "LEGACY-SERIES-LIST-01"
name = "series list"
method = "GET"
path = "/api/v1/series"
comparison = "json"
headers = { "X-Auth-Token" = "${LEGACY_DB_SMOKE_SESSION_TOKEN}" }

[[cases]]
id = "LEGACY-PAGE-READ-01"
name = "page read"
method = "GET"
path = "/api/v1/books/book-1/pages/1"
comparison = "binary_metadata"
headers = { "X-Auth-Token" = "${LEGACY_DB_SMOKE_SESSION_TOKEN}" }
